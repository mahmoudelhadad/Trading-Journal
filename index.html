// ─── Calculations ─────────────────────────────────────────────
function getP(sym){return PT[sym]||{f:1,pv:1,t:"forex"};}
function isFut(sym){return getP(sym).t==="futures";}
function pointLabel(sym){return isFut(sym)?"Points":"Pips";}

function calcR(t){
  if(!t.entryPrice||!t.stopLoss||!t.exitPrice)return null;
  var ep=+t.entryPrice,sl=+t.stopLoss,ex=+t.exitPrice,d=Math.abs(ep-sl);
  if(!d)return null;
  return t.direction==="Long"?(ex-ep)/d:(ep-ex)/d;
}
function calcPlannedR(t){
  if(!t.entryPrice||!t.stopLoss||!t.target)return null;
  var ep=+t.entryPrice,sl=+t.stopLoss,tg=+t.target,d=Math.abs(ep-sl);
  if(!d)return null;
  return t.direction==="Long"?(tg-ep)/d:(ep-tg)/d;
}
function calcPL(t){
  if(!t.entryPrice||!t.exitPrice||!t.positionSize||!t.symbol)return null;
  var p=getP(t.symbol);
  var diff=t.direction==="Long"?+t.exitPrice-+t.entryPrice:+t.entryPrice-+t.exitPrice;
  return +t.positionSize*diff*p.f*p.pv;
}
function calcRisk(t){
  if(!t.entryPrice||!t.stopLoss||!t.positionSize||!t.symbol)return null;
  var p=getP(t.symbol);
  return +t.positionSize*Math.abs(+t.entryPrice-+t.stopLoss)*p.f*p.pv;
}
function calcPoints(t){
  if(!t.entryPrice||!t.exitPrice||!t.symbol)return null;
  var p=getP(t.symbol);
  var diff=t.direction==="Long"?+t.exitPrice-+t.entryPrice:+t.entryPrice-+t.exitPrice;
  return Math.round(diff*p.f*100)/100;
}
function calcDur(t){
  if(!t.entryTime||!t.exitTime||!t.date)return null;
  try{var d=Math.abs(new Date(t.date+"T"+t.exitTime)-new Date(t.date+"T"+t.entryTime));
    return Math.floor(d/3600000)+"h "+Math.floor((d%3600000)/60000)+"m";}
  catch(err){return null;}
}
function outcome(r){if(r===null)return"";return r>0.2?"Green":r<-0.2?"Red":"Breakeven";}
function oc(o){return({Green:C.green,Red:C.red,Breakeven:C.gold})[o]||C.dim;}

function enrich(trades,accounts){
  // Group by account for running capital
  var accCaps={};
  accounts.forEach(function(a){accCaps[a.id]=a.capital;});
  var accRun={};
  accounts.forEach(function(a){accRun[a.id]=a.capital;});

  return trades.map(function(t,i){
    var accId=t.accountId||"default";
    if(!accRun[accId])accRun[accId]=10000;
    var r=calcR(t),pl=calcPL(t),rv=calcRisk(t),comm=t.commission?+t.commission:0;
    var netPL=pl!==null?pl-comm:null;
    var capital=accRun[accId];
    if(netPL!==null)accRun[accId]+=netPL;
    var o={};Object.keys(t).forEach(function(k){o[k]=t[k];});
    o._i=i+1;o._r=r;o._pts=calcPoints(t);o._pl=pl;o._netPL=netPL;o._rv=rv;
    o._rPct=(rv&&capital)?rv/capital:null;o._plannedR=calcPlannedR(t);
    o._outcome=outcome(r);o._capital=capital;o._dur=calcDur(t);
    o._isFutures=isFut(t.symbol||"");
    o._ptLabel=pointLabel(t.symbol||"");
    return o;
  });
}

var fr={
  r:function(v){return v===null?"—":(v>=0?"+":"")+v.toFixed(2)+"R";},
  pct:function(v){return v===null?"—":(v*100).toFixed(1)+"%";},
  usd:function(v){return v===null?"—":(v>=0?"+$":"-$")+Math.abs(v).toFixed(2);},
  pt:function(v){return v===null?"—":(v>=0?"+":"")+v.toFixed(2);},
};

function AccManager(props){
  var accs=props.accounts;
  var st=useState({name:"",capital:"10000",color:"#3B82F6"});var form=st[0],setForm=st[1];
  var sf=function(k){return function(v){setForm(function(p){var n={};Object.keys(p).forEach(function(pk){n[pk]=p[pk];});n[k]=v;return n;});};};

  function addAcc(){
    if(!form.name||!form.capital)return;
    props.onAdd({id:"acc_"+Date.now(),name:form.name,capital:parseFloat(form.capital)||10000,color:form.color});
    setForm({name:"",capital:"10000",color:"#3B82F6"});

  return h(Modal,{onClose:props.onClose},
    h("div",{style:{background:C.card,border:"1px solid "+C.border,borderRadius:12,width:"100%",maxWidth:500,marginTop:20}},
      h("div",{style:{padding:"13px 18px",borderBottom:"1px solid "+C.border,display:"flex",justifyContent:"space-between",alignItems:"center"}},

      ),

              h("div",{style:{flex:1}},

                h("div",{style:{color:C.dim,fontSize:10}},"Starting Capital: $"+a.capital.toLocaleString())

            })

        h("button",{onClick:addAcc,style:{background:C.teal,color:"#fff",border:"none",borderRadius:8,
          padding:"8px 20px",fontSize:12,fontWeight:700,cursor:"pointer",marginTop:8,width:"100%"}},

// ─── Aggregation ──────────────────────────────────────────────
function aggG(ts){
  var n=ts.length;
  var green=ts.filter(function(t){return t._outcome==="Green";}).length;
  var red=ts.filter(function(t){return t._outcome==="Red";}).length;
  var be=ts.filter(function(t){return t._outcome==="Breakeven";}).length;
  var d=green+red,wr=d>0?green/d:null;
  var totalR=ts.reduce(function(s,t){return s+(t._r||0);},0);
  var pl=ts.reduce(function(s,t){return s+(t._pl||0);},0);
  var netPL=ts.reduce(function(s,t){return s+(t._netPL||0);},0);
  var avgR=n>0?totalR/n:null;
  return{n:n,green:green,red:red,be:be,wr:wr,totalR:totalR,avgR:avgR,pl:pl,netPL:netPL};
}

function AggTable(props){
  var rows=props.rows,run=0;
  var hdrs=[props.keyLabel,"Trades","Green","Red","BE","Win%","Total R","Avg R","P/L","Net P/L","Cum P/L"];
  return h("div",{style:{overflowX:"auto",borderRadius:10,border:"1px solid "+C.border}},
    h("table",{style:{borderCollapse:"collapse",width:"100%"}},
      h("thead",null,h("tr",null,hdrs.map(function(hd){return h(Th,{key:hd},hd);}))),
      h("tbody",null,
        rows.length===0
          ?h("tr",null,h("td",{colSpan:11,style:{textAlign:"center",padding:40,color:C.dim,fontSize:13}},"No data yet — add trades in the Raw tab"))
          :rows.map(function(r,i){
            run+=r.netPL||0;var bg=i%2===0?C.row:C.rowAlt;
            return h("tr",{key:i,style:{background:bg}},
              h(Td,{s:{fontWeight:700,color:C.white}},r.key),
              h(Td,null,r.n),
              h(Td,{s:{color:C.green,fontWeight:700}},r.green),
              h(Td,{s:{color:C.red,fontWeight:700}},r.red),
              h(Td,{s:{color:C.gold}},r.be),
              h(Td,{s:{color:r.wr!==null&&r.wr>0.5?C.green:C.red}},r.wr!==null?(r.wr*100).toFixed(0)+"%":"—"),
              h(Td,{s:{color:r.totalR>=0?C.green:C.red,fontWeight:700}},r.totalR.toFixed(2)),
              h(Td,{s:{color:r.avgR>=0?C.green:C.red}},r.avgR!==null?r.avgR.toFixed(2):"—"),
              h(Td,{s:{color:r.pl>=0?C.green:C.red}},fr.usd(r.pl)),
              h(Td,{s:{color:r.netPL>=0?C.green:C.red}},fr.usd(r.netPL)),
              h(Td,{s:{color:run>=0?C.green:C.red,fontWeight:700}},fr.usd(run))
            );
          })
      )
    )
  );
}

function getWeekStart(d){
  var dt=new Date(d+"T12:00"),day=dt.getDay(),diff=day===0?-6:1-day;
  dt.setDate(dt.getDate()+diff);return dt.toISOString().split("T")[0];
}
function DailyTab(props){
  var rows=useMemo(function(){
    var m={};props.trades.forEach(function(t){if(!t.date)return;if(!m[t.date])m[t.date]=[];m[t.date].push(t);});
    return Object.entries(m).sort(function(a,b){return a[0]>b[0]?1:-1;}).map(function(ent){
      var dn=new Date(ent[0]+"T12:00").toLocaleDateString("en",{weekday:"short"});
      var obj=aggG(ent[1]);obj.key=ent[0]+" ("+dn+")";return obj;
    });
  },[props.trades]);
  return h("div",null,h("div",{style:{color:C.dim,fontSize:11,marginBottom:12}},rows.length+" trading days"),h(AggTable,{rows:rows,keyLabel:"Date"}));
}
function WeeklyTab(props){
  var rows=useMemo(function(){
    var m={};props.trades.forEach(function(t){if(!t.date)return;var w=getWeekStart(t.date);if(!m[w])m[w]=[];m[w].push(t);});
    return Object.entries(m).sort(function(a,b){return a[0]>b[0]?1:-1;}).map(function(ent){
      var end=new Date(ent[0]+"T12:00");end.setDate(end.getDate()+4);
      var obj=aggG(ent[1]);obj.key=ent[0]+" → "+end.toISOString().split("T")[0];return obj;
    });
  },[props.trades]);
  return h("div",null,h("div",{style:{color:C.dim,fontSize:11,marginBottom:12}},rows.length+" weeks"),h(AggTable,{rows:rows,keyLabel:"Week"}));
}
function MonthlyTab(props){
  var rows=useMemo(function(){
    var m={};props.trades.forEach(function(t){if(!t.date)return;var k=t.date.slice(0,7);if(!m[k])m[k]=[];m[k].push(t);});
    return Object.entries(m).sort(function(a,b){return a[0]>b[0]?1:-1;}).map(function(ent){
      var parts=ent[0].split("-");var obj=aggG(ent[1]);
      obj.key=new Date(+parts[0],+parts[1]-1,1).toLocaleDateString("en",{month:"long",year:"numeric"});return obj;
    });
  },[props.trades]);
  return h("div",null,h("div",{style:{color:C.dim,fontSize:11,marginBottom:12}},rows.length+" months"),h(AggTable,{rows:rows,keyLabel:"Month"}));
}

  var be=trades.filter(function(t){return t._outcome==="Breakeven";}).length;
  var denom=green+red,wr=denom>0?(green/denom*100).toFixed(1)+"%":"—";
  var totalNPL=trades.reduce(function(s,t){return s+(t._netPL||0);},0);
  var totalR=trades.reduce(function(s,t){return s+(t._r||0);},0);

  // Equity curves per account (or combined)
  var eqData=[];
  if(accFilter==="all"){
    var run2=accounts.reduce(function(s,a){return s+a.capital;},0);
    eqData.push({x:0,eq:run2});
    trades.forEach(function(t,i){run2+=t._netPL||0;eqData.push({x:i+1,eq:Math.round(run2*100)/100});});
  } else {
    var acc=accounts.find(function(a){return a.id===accFilter;})||{capital:10000};
    var run3=acc.capital;

  var totalCap=accFilter==="all"?accounts.reduce(function(s,a){return s+a.capital;},0):(accounts.find(function(a){return a.id===accFilter;})||{capital:0}).capital;

            h(YAxis,{dataKey:"s",type:"category",stroke:C.dim,tick:{fontSize:9},width:60}),
            h(Tooltip,TT),
            h(Bar,{dataKey:"R",radius:[0,4,4,0]},symData.map(function(d,i){
              var fc=d.mkt==="futures"?(d.R>=0?C.orange:"#7B3A1A"):(d.R>=0?C.green:C.red);
              return h(Cell,{key:i,fill:fc});
            }))
          )
        )
      )
    )
  );
}

// ─── Strategy Tab ─────────────────────────────────────────────
function byField(trades,field,list){
  return list.map(function(k){
    var ts=trades.filter(function(t){return t[field]===k;});
    if(!ts.length)return null;
    var obj=aggG(ts);obj.key=k;return obj;
  }).filter(Boolean);
}

function PerfTable(props){
  var cols=[
    {k:"key",l:"Name"},{k:"n",l:"Trades"},
    {k:"wr",l:"Win%",fn:function(v){return v!==null?(v*100).toFixed(0)+"%":"—";},c:function(v){return v>0.5?C.green:C.red;}},
    {k:"totalR",l:"Total R",fn:function(v){return v.toFixed(2);},c:function(v){return v>=0?C.green:C.red;}},
    {k:"avgR",l:"Avg R",fn:function(v){return v!==null?v.toFixed(2):"—";},c:function(v){return v>=0?C.green:C.red;}},
  ];
  return h("div",{style:Object.assign({},cs,{flex:1,minWidth:250})},
    h("div",{style:Object.assign({},ct,{color:props.color})},props.title),
    h("table",{style:{width:"100%",borderCollapse:"collapse"}},
      h("thead",null,h("tr",null,cols.map(function(c){return h(Th,{key:c.k},c.l);}))),
      h("tbody",null,
        props.rows.length===0
          ?h("tr",null,h("td",{colSpan:5,style:{textAlign:"center",padding:14,color:C.dim,fontSize:11}},"Not enough data yet"))
          :props.rows.map(function(r,i){
            return h("tr",{key:i,style:{background:i%2===0?C.row:C.rowAlt}},
              cols.map(function(c){return h(Td,{key:c.k,s:c.c?{color:c.c(r[c.k])}:{}},c.fn?c.fn(r[c.k]):r[c.k]);})
            );
          })
      )
    )
  );
}

function StrategyTab(props){
  var trades=props.trades;
  var byEntry=useMemo(function(){return byField(trades,"entrySetup",LISTS.EntrySetup);},[trades]);
  var byDaily=useMemo(function(){return byField(trades,"dailySetup",LISTS.DailySetup);},[trades]);
  var byST=useMemo(function(){return byField(trades,"setupType",LISTS.SetupType);},[trades]);
  var bySess=useMemo(function(){return byField(trades,"session",LISTS.Session);},[trades]);
  var byDay=useMemo(function(){
    var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday"];
    return DAYS.map(function(d){
      var ts=trades.filter(function(t){return t.date&&new Date(t.date+"T12:00").toLocaleDateString("en",{weekday:"long"})===d;});
      if(!ts.length)return null;var obj=aggG(ts);obj.key=d.slice(0,3);return obj;
    }).filter(Boolean);
  },[trades]);
  var slStudy=useMemo(function(){
    return [{l:"Actual R",f:"_r",direct:true},{l:"Be SL",f:"beSL"},{l:"Af SL",f:"afSL"},
      {l:"SL 1",f:"sl1"},{l:"SL 2",f:"sl2"},{l:"SL 3",f:"sl3"}
    ].map(function(item){
      var vals=trades.map(function(t){return item.direct?t._r:(t[item.f]?+t[item.f]:null);}).filter(function(v){return v!==null;});
      if(!vals.length)return null;
      var avg=vals.reduce(function(s,v){return s+v;},0)/vals.length;
      return{l:item.l,n:vals.length,avg:+(avg.toFixed(2)),max:+(Math.max.apply(null,vals).toFixed(2)),min:+(Math.min.apply(null,vals).toFixed(2))};
    }).filter(Boolean);
  },[trades]);
  var tmStudy=useMemo(function(){
    return ["tm1","tm2","tm3","tm4","tm5","tm6"].map(function(f,i){
      var vals=trades.map(function(t){return t[f]?+t[f]:null;}).filter(function(v){return v!==null;});
      if(!vals.length)return null;
      var avg=vals.reduce(function(s,v){return s+v;},0)/vals.length;
      return{l:"TM "+(i+1),n:vals.length,avg:+(avg.toFixed(2)),max:+(Math.max.apply(null,vals).toFixed(2))};
    }).filter(Boolean);
  },[trades]);

  var noData=h("div",{style:{color:C.dim,fontSize:11,padding:16,textAlign:"center"}},"Not enough data yet");
  return h("div",null,
    h("div",{style:{display:"flex",gap:12,flexWrap:"wrap",marginBottom:12}},
      h(PerfTable,{title:"By Entry Setup",color:C.green,rows:byEntry}),
      h(PerfTable,{title:"By Daily Setup",color:C.blue,rows:byDaily})
    ),
    h("div",{style:{display:"flex",gap:12,flexWrap:"wrap",marginBottom:12}},
      h(PerfTable,{title:"By Session",color:C.teal,rows:bySess}),
      h(PerfTable,{title:"By Setup Type",color:C.gold,rows:byST})
    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}},
      h(Card,null,h("div",{style:Object.assign({},ct,{color:C.purple})},"Avg R by Day of Week"),
        byDay.length===0?noData:h(ResponsiveContainer,{width:"100%",height:160},
          h(BarChart,{data:byDay.map(function(r){return{name:r.key,avgR:+(r.avgR||0).toFixed(2)};})},
            h(CartesianGrid,{strokeDasharray:"3 3",stroke:C.border}),
            h(XAxis,{dataKey:"name",stroke:C.dim,tick:{fontSize:10}}),h(YAxis,{stroke:C.dim,tick:{fontSize:9}}),
            h(Tooltip,TT),
            h(Bar,{dataKey:"avgR",radius:[4,4,0,0]},byDay.map(function(d,i){return h(Cell,{key:i,fill:d.avgR>=0?C.green:C.red});}))
          )
        )
      ),
      h(Card,null,h("div",{style:Object.assign({},ct,{color:C.teal})},"Win Rate by Entry Setup"),
        byEntry.length===0?noData:h(ResponsiveContainer,{width:"100%",height:160},
          h(BarChart,{data:byEntry.map(function(r){return{name:r.key,wr:r.wr!==null?+(r.wr*100).toFixed(1):0};})},
            h(CartesianGrid,{strokeDasharray:"3 3",stroke:C.border}),
            h(XAxis,{dataKey:"name",stroke:C.dim,tick:{fontSize:9}}),
            h(YAxis,{stroke:C.dim,tick:{fontSize:9},domain:[0,100],tickFormatter:function(v){return v+"%";}}),
            h(Tooltip,TT),h(Bar,{dataKey:"wr",fill:C.blue,radius:[4,4,0,0]})
          )
        )
      )
    ),
    h("div",{style:{display:"flex",gap:12,flexWrap:"wrap"}},
      h("div",{style:Object.assign({},cs,{flex:1,minWidth:250})},
        h("div",{style:Object.assign({},ct,{color:C.gold})},"SL Study — Avg R Comparison"),
        h("table",{style:{width:"100%",borderCollapse:"collapse"}},
          h("thead",null,h("tr",null,h(Th,null,"SL"),h(Th,null,"n"),h(Th,null,"Avg R"),h(Th,null,"Max"),h(Th,null,"Min"))),
          h("tbody",null,
            slStudy.length===0?h("tr",null,h("td",{colSpan:5,style:{textAlign:"center",padding:12,color:C.dim,fontSize:11}},"Add trades with SL data"))
            :slStudy.map(function(r,i){
              return h("tr",{key:i,style:{background:i%2===0?C.row:C.rowAlt}},
                h(Td,{s:{fontWeight:700}},r.l),h(Td,null,r.n),
                h(Td,{s:{color:r.avg>=0?C.green:C.red,fontWeight:700}},r.avg),
                h(Td,{s:{color:C.green}},r.max),h(Td,{s:{color:C.red}},r.min)
              );
            })
          )
        )
      ),
      h("div",{style:Object.assign({},cs,{flex:1,minWidth:250})},
        h("div",{style:Object.assign({},ct,{color:C.blue})},"Trade Management R"),
        h("table",{style:{width:"100%",borderCollapse:"collapse"}},
          h("thead",null,h("tr",null,h(Th,null,"TM"),h(Th,null,"n"),h(Th,null,"Avg R"),h(Th,null,"Max R"))),
          h("tbody",null,
            tmStudy.length===0?h("tr",null,h("td",{colSpan:4,style:{textAlign:"center",padding:12,color:C.dim,fontSize:11}},"Add trades with TM data"))
            :tmStudy.map(function(r,i){
              return h("tr",{key:i,style:{background:i%2===0?C.row:C.rowAlt}},
                h(Td,{s:{fontWeight:700}},r.l),h(Td,null,r.n),
                h(Td,{s:{color:r.avg>=0?C.green:C.red,fontWeight:700}},r.avg),
                h(Td,{s:{color:C.green}},r.max)
              );
            })
          )
        )
      )
    )
  );
}

// ─── Main App ─────────────────────────────────────────────────
function App(){
  var rs=useState([]); var raw=rs[0],setRaw=rs[1];
  var as=useState(DEFAULT_ACCOUNTS); var accounts=as[0],setAccounts=as[1];
  var ts=useState("dashboard"); var tab=ts[0],setTab=ts[1];
  var fs=useState(false); var showForm=fs[0],setShowForm=fs[1];
  var et=useState(null); var editT=et[0],setEditT=et[1];
  var sm=useState(false); var showAccMgr=sm[0],setShowAccMgr=sm[1];
  var af=useState("all"); var accFilter=af[0],setAccFilter=af[1];
  var mf=useState("all"); var mktFilter=mf[0],setMktFilter=mf[1];

  useEffect(function(){
    var r=LS.get("fxj_trades_v3"); if(r)setRaw(r);
    var a=LS.get("fxj_accounts_v3"); if(a&&a.length)setAccounts(a);
  },[]);
  useEffect(function(){LS.set("fxj_trades_v3",raw);},[raw]);
  useEffect(function(){LS.set("fxj_accounts_v3",accounts);},[accounts]);

  var allTrades=useMemo(function(){return enrich(raw,accounts);},[raw,accounts]);

  // Apply filters
  var trades=useMemo(function(){
    return allTrades.filter(function(t){
      var passAcc=accFilter==="all"||t.accountId===accFilter;
      var passMkt=mktFilter==="all"||(mktFilter==="futures"&&t._isFutures)||(mktFilter==="forex"&&!t._isFutures);
      return passAcc&&passMkt;
    });
  },[allTrades,accFilter,mktFilter]);

  var activeAcc=useMemo(function(){
    if(accFilter==="all")return null;
    return accounts.find(function(a){return a.id===accFilter;})||null;
  },[accounts,accFilter]);

  function saveTrade(t){
    if(editT)setRaw(function(p){return p.map(function(x){return x._tid===editT._tid?Object.assign({},t,{_tid:editT._tid}):x;});});
    else setRaw(function(p){return p.concat([Object.assign({},t,{_tid:Date.now()})]);});
    setShowForm(false);setEditT(null);
  }
  function delTrade(id){if(window.confirm("Delete this trade?"))setRaw(function(p){return p.filter(function(t){return t._tid!==id;});});}
  function openEdit(t){setEditT(t);setShowForm(true);}
  function openAdd(){setEditT(null);setShowForm(true);}
  function addAccount(a){setAccounts(function(p){return p.concat([a]);});}
  function delAccount(id){
    setAccounts(function(p){return p.filter(function(a){return a.id!==id;});});
    setRaw(function(p){return p.map(function(t){return t.accountId===id?Object.assign({},t,{accountId:accounts[0].id}):t;});});
    if(accFilter===id)setAccFilter("all");
  }

  var TABS=[
    {id:"dashboard",l:"📊 Dashboard"},{id:"raw",l:"📋 Raw"},
    {id:"daily",l:"📅 Daily"},{id:"weekly",l:"📆 Weekly"},
    {id:"monthly",l:"🗓 Monthly"},{id:"strategy",l:"🧠 Strategy"},
  ];

  return h("div",{style:{background:C.bg,minHeight:"100vh",color:C.text}},
    // Header
    h("div",{style:{background:C.card,borderBottom:"1px solid "+C.border,padding:"9px 16px",
      display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}},
      h("div",{style:{display:"flex",alignItems:"center",gap:10}},
        h("div",{style:{width:32,height:32,borderRadius:8,background:"linear-gradient(135deg,#1E3A6E,#0D2344)",
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}},"📈"),
        h("div",null,
          h("div",{style:{fontWeight:800,fontSize:14,color:"#fff"}},"Trading Journal"),
          h("div",{style:{fontSize:9,color:C.dim}},raw.length+" trades · "+accounts.length+" account"+(accounts.length!==1?"s":""))
        )
      ),
      h("div",{style:{display:"flex",gap:6,alignItems:"center"}},
        h("button",{onClick:openAdd,style:{background:C.blue,color:"#fff",border:"none",borderRadius:7,padding:"6px 13px",fontSize:11,fontWeight:700}},"+ New Trade"),
        h("button",{onClick:function(){setShowAccMgr(true);},style:{background:C.row,border:"1px solid "+C.border,color:C.text,borderRadius:7,padding:"6px 10px",fontSize:11}},
          "💼 Accounts")
      )
    ),
    // Filter bar
    h(FilterBar,{accounts:accounts,accFilter:accFilter,setAccFilter:setAccFilter,mktFilter:mktFilter,setMktFilter:setMktFilter}),
    // Tabs
    h("div",{style:{background:C.card,borderBottom:"1px solid "+C.border,padding:"0 16px",display:"flex",gap:2,overflowX:"auto"}},
      TABS.map(function(t){
        var active=tab===t.id;
        return h("button",{key:t.id,className:"tab-btn"+(active?" active":""),onClick:function(){setTab(t.id);}},t.l);
      })
    ),
    // Content
    h("div",{style:{padding:14}},
      tab==="dashboard"&&h(DashboardTab,{trades:trades,accounts:accounts,accFilter:accFilter}),
      tab==="raw"&&h(RawTab,{trades:trades,accounts:accounts,onEdit:openEdit,onDelete:delTrade,onAdd:openAdd}),
      tab==="daily"&&h(DailyTab,{trades:trades}),
      tab==="weekly"&&h(WeeklyTab,{trades:trades}),
      tab==="monthly"&&h(MonthlyTab,{trades:trades}),
      tab==="strategy"&&h(StrategyTab,{trades:trades})
    ),
    showForm&&h(TradeForm,{trade:editT,accounts:accounts,defaultAccId:accFilter!=="all"?accFilter:(accounts[0]||{id:"acc_1"}).id,
      onSave:saveTrade,onClose:function(){setShowForm(false);setEditT(null);}}),
    showAccMgr&&h(AccManager,{accounts:accounts,onAdd:addAccount,onDelete:delAccount,onClose:function(){setShowAccMgr(false);}})
  );
}

RD.render(R.createElement(App),document.getElementById("root"));
}
</script>
</body>
</html>
